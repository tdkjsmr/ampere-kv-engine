name: 缺陷报告
description: 报告可复现的正确性、构建或性能问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴访问令牌、个人信息、自然语言 Prompt 或私有模型输出。

  - type: input
    id: commit
    attributes:
      label: Git Commit
      description: 发生问题时使用的完整 Commit SHA
    validations:
      required: true

  - type: input
    id: run_id
    attributes:
      label: Run ID
      description: 对应 results/runs 中的本地运行标识
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 问题层级
      options:
        - CPU 契约
        - CUDA 构建
        - CUDA Kernel
        - Triton Kernel
        - 模型正确性
        - 性能测量
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 只填写命令、Shape 和公开配置，不要包含 Prompt 内容
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为与错误
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我确认内容不包含凭据、个人信息、Prompt 或私有模型输出
          required: true
