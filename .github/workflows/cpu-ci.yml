name: CPU CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-contract:
    runs-on: ubuntu-22.04
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装 CPU 测试依赖
        run: python -m pip install -e ".[dev]"

      - name: 检查 Python 语法
        run: python -m compileall ampere_kv scripts tests triton_kernels setup.py

      - name: 运行 CPU 契约测试
        run: python -m pytest tests/cpu

      - name: 校验模型锁
        run: >-
          python -m ampere_kv.model.contract
          --lock configs/model.lock.yaml
          --config tests/fixtures/qwen3_8b_config.json
