[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ampere-kv-engine"
version = "0.1.0.dev0"
description = "面向 RTX 3090 的 Qwen3-8B 单卡推理引擎"
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "LicenseRef-Pending" }
authors = [
  { name = "AmpereKV Engine" },
]
dependencies = [
  "PyYAML>=6.0.1",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
gpu = [
  "huggingface-hub>=0.24",
  "torch==2.5.1",
  "transformers==4.51.0",
]

[tool.setuptools.packages.find]
include = ["ampere_kv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: 需要真实 NVIDIA GPU 和 CUDA 环境的测试",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
